<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éditeur de tests</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--card:#E7E7E5;--bd:#5c5c58;--gray:#c7c7c4;--acc:#FFBA6B;--accd:#e8a04f;--red:#c0342c;--ink:#26261f;--ok:#8bc46a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;font-family:'Inter',sans-serif;color:var(--ink)}
h2,.d{font-family:'Space Grotesk',sans-serif}
button{font-family:inherit;cursor:pointer}
.corner{position:fixed;top:0;left:0;width:0;height:0;border-top:90px solid var(--red);border-right:90px solid transparent;z-index:5}

/* Accueil */
#home{min-height:100vh;display:flex;position:relative}
.grid{position:absolute;inset:0 auto 0 0;width:55%;background-image:linear-gradient(#d9d9d6 1px,transparent 1px),linear-gradient(90deg,#d9d9d6 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:linear-gradient(90deg,#000 30%,transparent);mask-image:linear-gradient(90deg,#000 30%,transparent)}
.side{position:relative;width:300px;margin:120px 0 40px 60px}
.newbtn{width:100%;height:70px;border:2px solid #8f8f8a;background:var(--gray);border-radius:0;font:700 2rem 'Space Grotesk',sans-serif}
.newbtn:hover{background:#b7b7b3}
.col{margin-top:16px;background:#fff;border:2px solid #1c1c18;border-radius:16px;overflow:hidden}
.col h2{margin:0;padding:14px 10px 10px;text-align:center;font-size:1.05rem;border-bottom:2px solid #1c1c18}
#list{padding:12px;max-height:55vh;overflow-y:auto}
.t{position:relative;background-color:#4a4a47;background-image:linear-gradient(rgba(210,210,206,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(210,210,206,.25) 1px,transparent 1px);background-size:14px 14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);border:2px solid #2c2c2a;border-radius:0;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);padding:18px 10px;margin-bottom:10px;text-align:center;font:600 .95rem 'Space Grotesk',sans-serif;cursor:pointer;word-break:break-word}
.t:hover{background-color:#5c5c58}
.empty{margin:14px 6px;text-align:center;font-size:.8rem;color:#8a8a85}
#userBar{position:fixed;top:14px;right:20px;display:none;align-items:center;gap:10px;font-size:.78rem;color:#6b6b67;z-index:6}
#userBar button{border:none;background:none;padding:0;color:#0b6bd3;font:600 .78rem 'Inter',sans-serif;text-decoration:underline;cursor:pointer}
.pub{position:absolute;top:6px;right:24px;width:14px;height:16px;filter:drop-shadow(2px 2px 0 #2f5fa3)}
.pub::before{content:"";position:absolute;left:0;top:0;border:7px solid transparent;border-top:0;border-bottom:8px solid #FFD43B}
.pub::after{content:"";position:absolute;left:4px;top:8px;width:6px;height:8px;background:#FFD43B}
.cond{font-size:.85rem;line-height:1.5;margin:0 0 14px}
.box .chk{display:flex;gap:8px;align-items:center;font-size:.85rem;font-weight:600;cursor:pointer;margin:0}
.box .chk input{width:auto;padding:0}
#tmenu{position:fixed;display:none;background:#fff;border:2px solid #1c1c18;border-radius:12px;overflow:hidden;z-index:20}
#tmenu.show{display:block}
#tmenu button,.qmenu button{display:block;width:100%;border:none;background:#fff;padding:11px 12px;text-align:left;font-size:.88rem;font-weight:600}
#tmenu button:hover:not(:disabled),.qmenu button:hover{background:#f2f2ef}
#tmenu button:disabled{color:#a5a5a1;cursor:not-allowed}
#tmenu #tDel{color:#c0342c}

/* Fenêtre de nom */
.ov{position:fixed;inset:0;background:rgba(20,20,18,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.show{display:flex}
.box{background:#fff;border:2px solid #1c1c18;border-radius:10px;width:340px;max-width:100%;padding:26px}
.box label{display:block;font-weight:600;font-size:.9rem;margin-bottom:8px}
.box input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #9b9b96;background:#fbfbfa;font:inherit}
.box input:focus{outline:2px solid var(--accd);outline-offset:1px}
.create{display:block;width:100%;margin-top:18px;border:none;border-radius:14px;padding:12px;background:var(--red);color:#fff;font:600 .95rem 'Space Grotesk',sans-serif}
.create:hover{background:#a82c25}

/* Éditeur */
#editor,#play{display:none;min-height:100vh}
.tools{width:92px;flex-shrink:0;background:#EDEDEB;border-right:2px solid #1c1c18;padding:12px 10px 14px;display:flex;flex-direction:column}
.tbar{width:100%;aspect-ratio:1/1;background:#C9C9C7;display:flex;align-items:center;justify-content:center;text-align:center;margin-bottom:14px;font:700 .72rem/1.2 'Space Grotesk',sans-serif;color:var(--ink)}
.tool{width:100%;aspect-ratio:1/1;border:none;border-radius:0;margin-bottom:10px;padding:0;display:flex;align-items:center;justify-content:center;font:800 1.5rem 'Space Grotesk',sans-serif;color:var(--ink);cursor:grab;touch-action:none}
.tool.off{opacity:.4;cursor:not-allowed}
#tMask{background:#B3B3B3}
#tHint{background:#C7C5C5}
#trash{margin-top:auto;width:100%;aspect-ratio:1/1;border:2px dashed #8f8f8a;position:relative}
#trash.hot{background:#f8dcdc;border-color:var(--red)}
.bin{position:absolute;left:50%;top:50%;width:20px;height:24px;margin:-6px 0 0 -10px;border:3px solid #6b6b67;border-top:none;border-radius:0 0 4px 4px}
.bin::before{content:"";position:absolute;left:-7px;top:-6px;width:28px;height:3px;background:#6b6b67}
.bin::after{content:"";position:absolute;left:2px;top:-12px;width:4px;height:3px;border:3px solid #6b6b67;border-bottom:none}
.bulb{position:relative;display:inline-block;width:20px;height:28px}
.bulb::before{content:"";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:#FFD43B;box-shadow:0 0 6px rgba(255,200,0,.7)}
.bulb::after{content:"";position:absolute;left:5px;top:20px;width:10px;height:6px;background:#8f8f8a;border-radius:0 0 3px 3px}
#tip{position:fixed;display:none;max-width:230px;background:#fff;border:2px solid #000;padding:8px 10px;color:#000;font-size:.78rem;line-height:1.4;z-index:120;pointer-events:none}
#ghost{position:fixed;display:none;pointer-events:none;z-index:150;transform:translate(-50%,-50%)}
.gh-mask{width:34px;height:34px;background:#FFBA6B;border:2px solid #e8a04f;border-radius:8px;font:800 1.1rem/30px 'Space Grotesk',sans-serif;text-align:center;color:var(--ink)}
.mk{position:absolute;top:-9px;right:-9px;width:22px;height:22px;background:#FFBA6B;border:1.5px solid #e8a04f;border-radius:6px;font:800 .8rem 'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.hcell{position:absolute;top:0;width:46px;height:46px;border:2px dashed #d4a800;background:rgba(255,212,59,.2);display:none;align-items:center;justify-content:center}
.hcell[data-p="l"]{left:62px}
.hcell[data-p="r"]{right:62px}
body.carry-hint .hcell{display:flex}
.hcell.has{display:flex;border-style:solid}
.hcell .bulb{cursor:grab;touch-action:none}
.hin{position:absolute;bottom:56px;width:210px;padding:8px 10px;border:1.5px solid #d4a800;background:#fffbe0;font:600 .85rem 'Inter',sans-serif;z-index:5}
.hin[data-p="l"]{left:62px}
.hin[data-p="r"]{right:62px}
.hin:focus{outline:2px solid var(--accd)}
.ch.mys{background:#FFBA6B;border-color:#e8a04f}
.ch.mys .l{font-weight:800}
.hb{position:absolute;bottom:24px;width:46px;height:46px;border:2px solid #d4a800;background:#fff8d6;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.hb.l{left:94px}
.hb.r{right:94px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:40px 20px 110px}
.tname{font-weight:700;font-size:1.1rem;margin-bottom:14px;text-align:center}
.card{position:relative;background:var(--card);border:2px solid var(--bd);border-radius:22px;width:520px;max-width:100%;min-height:380px;padding:26px 32px 24px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.prog{text-align:center;font-size:.75rem;font-weight:600;letter-spacing:.04em;color:#6b6b67;margin-bottom:12px}
.qt{width:100%;resize:none;border:1.5px dashed transparent;background:transparent;border-radius:10px;padding:8px;text-align:center;font:600 1.05rem 'Inter',sans-serif;color:var(--ink);margin-bottom:14px}
.qt:hover,.qt:focus{border-color:#9b9b96;background:#f3f3f1;outline:none}
.opts{flex:1}
.ch{position:relative;width:78%;margin:0 auto 12px;padding:5px 12%;background:var(--gray);border:1.5px solid #8f8f8a;border-radius:12px;cursor:pointer}
.ch:hover{background:#b7b7b3}
.ch.on{background:var(--ok);border-color:#3f7a2b}
.ch input{width:100%;border:none;background:transparent;text-align:center;font:600 .95rem 'Inter',sans-serif;color:var(--ink);padding:7px 0;border-radius:6px;cursor:text}
.ch input:focus{outline:none;background:rgba(255,255,255,.55)}
.x{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:4px 7px;border-radius:6px;font-size:.8rem;font-weight:700;color:#5c1414;cursor:pointer}
.x:hover{background:rgba(255,255,255,.6)}
.ch.sel{background:var(--acc);border-color:var(--accd)}
.ch.bad{background:#e05252;border-color:#9c2b2b}
.ch .l{display:block;text-align:center;font:600 .95rem 'Inter',sans-serif;padding:7px 0}
.vb.go{opacity:1;cursor:pointer}
.vb.go:hover{background:var(--accd)}
.pq{text-align:center;font:600 1.05rem 'Inter',sans-serif;margin:0 0 16px;word-break:break-word}
.rec{text-align:left;font-size:.85rem;font-weight:600;padding:8px 10px;margin-bottom:8px;border-radius:10px;border:1.5px solid;word-break:break-word}
.rec small{font-weight:400}
.rec.ok{background:#e3f3da;border-color:#3f7a2b}
.rec.ko{background:#f8dcdc;border-color:#c0342c}
.addc{display:block;width:78%;margin:0 auto 12px;padding:10px;border:1.5px dashed #8f8f8a;border-radius:12px;background:transparent;font-size:1.2rem;font-weight:700}
.addc:hover{background:#dcdcd9}
.ans{display:block;width:78%;margin:0 auto 14px;padding:11px 12px;border:1.5px solid #8f8f8a;border-radius:12px;background:#fbfbfa;text-align:center;font:600 .95rem 'Inter',sans-serif}
.ans:focus{outline:2px solid var(--accd);outline-offset:1px}
.vb{display:block;margin:6px auto 0;border:none;border-radius:14px;padding:11px 24px;background:var(--acc);color:#3a2408;font:600 .92rem 'Space Grotesk',sans-serif;opacity:.75;cursor:default}
.hint{margin:10px 8px 0;text-align:center;font-size:.72rem;color:#6b6b67;line-height:1.4}
.foot{display:flex;justify-content:space-between;margin-top:18px;position:relative;min-height:46px}
.nav{position:relative;width:48px;height:46px;padding:0;border:1px solid #bdbdb9;background:linear-gradient(180deg,#fff 0%,#f4f4f2 50%,#dddddb 100%);box-shadow:0 3px 0 #b3b3af,0 6px 10px rgba(0,0,0,.28),inset 0 1px 0 #fff;cursor:pointer;transition:transform .08s,box-shadow .08s}
.nav:hover:not(:disabled){background:linear-gradient(180deg,#fff 0%,#faf9f7 50%,#e6e5e2 100%)}
.nav:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #b3b3af,0 2px 5px rgba(0,0,0,.28),inset 0 1px 0 #fff}
.nav:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 2px 0 #b3b3af}
.nav.l{border-radius:12px 0 0 12px}
.nav.r,.nav.p{border-radius:0 12px 12px 0;margin-left:-1px}
.nav.del{border-radius:12px}
.ngrp{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex}
.nav.l::before,.nav.r::before{content:"";position:absolute;top:15px;width:14px;height:14px;border:solid #8f1d17;border-width:0 0 4px 4px;transform:rotate(45deg);filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}
.nav.l::before{left:18px}
.nav.r::before{left:14px;border-width:4px 4px 0 0}
.nav.p::before,.nav.p::after{content:"";position:absolute;background:linear-gradient(180deg,#b3261e,#7a1510);border-radius:2px;box-shadow:0 2px 2px rgba(0,0,0,.35)}
.nav.p::before{left:12px;top:20px;width:22px;height:4px}
.nav.p::after{left:21px;top:11px;width:4px;height:22px}
.nav .bin{border-color:#8f1d17;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}
.nav .bin::before{background:#8f1d17}
.nav .bin::after{border-color:#8f1d17}
.finrow{position:fixed;right:24px;bottom:24px;display:flex;gap:12px;z-index:6}
.finrow .fin{position:static}
.fin.ann{background:var(--gray);color:var(--ink)}
.fin.ann:hover{background:#b7b7b3}
.qmenu{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;width:250px;background:#fff;border:2px solid #1c1c18;border-radius:12px;overflow:hidden;display:none;z-index:10}
.qmenu.show{display:block}
.msg{min-height:1.2em;margin:14px 0 0;font-size:.85rem;font-weight:600;color:var(--red);text-align:center}
.fin{position:fixed;right:24px;bottom:24px;border:none;border-radius:14px;padding:13px 22px;background:var(--acc);color:#3a2408;font:600 .95rem 'Space Grotesk',sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:6}
.fin:hover{background:var(--accd)}
@media (max-width:760px){.side{margin-left:20px;width:calc(100% - 40px)}.tools{display:none}.card{padding:22px 18px}}
</style>
</head>
<body>
<div class="corner"></div>
<div id="userBar"><span id="userMail"></span><button id="logoutBtn">Se déconnecter</button></div>

<div id="home">
  <div class="grid"></div>
  <div class="side">
    <button class="newbtn" id="newBtn" aria-label="Créer un test">+</button>
    <div class="col"><h2>Tests créés</h2><div id="list"></div></div>
  </div>
</div>

<div id="tmenu"><button id="tEdit">Éditer le test</button><button id="tTry">Essayer le test</button><button id="tPub">Publier le test</button><button id="tDel">Supprimer le test</button></div>

<div class="ov" id="ov">
  <div class="box">
    <label for="nameIn">Nom du test</label>
    <input id="nameIn" maxlength="40" autocomplete="off">
    <button class="create" id="createBtn">Créer</button>
  </div>
</div>

<div class="ov" id="aov">
  <div class="box">
    <p id="amsg" style="margin:0;font-weight:600;line-height:1.4"></p>
    <div style="display:flex;gap:10px">
      <button class="create" id="aNo" style="width:auto;flex:1;background:var(--gray);color:var(--ink)"></button>
      <button class="create" id="aYes" style="width:auto;flex:1"></button>
    </div>
  </div>
</div>

<div class="ov" id="pov">
  <div class="box">
    <h2 class="d" style="margin:0 0 12px;font-size:1.05rem;text-align:center">Conditions de publication</h2>
    <p class="cond">En publiant ce test, je confirme qu’il ne contient aucun contenu illégal, haineux, violent ou sexuel, ni donnée personnelle. Il sera visible et jouable par tous les visiteurs du site, et l’administrateur peut le supprimer à tout moment.</p>
    <label class="chk"><input type="checkbox" id="pAcc"> J’accepte ces conditions</label>
    <p class="msg" id="pMsg"></p>
    <div style="display:flex;gap:10px">
      <button class="create" id="pNo" style="width:auto;flex:1;margin-top:8px;background:var(--gray);color:var(--ink)">Annuler</button>
      <button class="create" id="pYes" style="width:auto;flex:1;margin-top:8px" disabled>Publier</button>
    </div>
  </div>
</div>

<div class="ov" id="cov">
  <div class="box">
    <p id="cmsg" style="margin:0;font-weight:600;line-height:1.4"></p>
    <div style="display:flex;gap:10px">
      <button class="create" id="cNo" style="width:auto;flex:1;background:var(--gray);color:var(--ink)">Annuler</button>
      <button class="create" id="cYes" style="width:auto;flex:1">Supprimer</button>
    </div>
  </div>
</div>

<div id="editor">
  <aside class="tools">
    <div class="tbar">Barre d’outils</div>
    <button class="tool" id="tMask" aria-label="Cache choix">?</button>
    <button class="tool" id="tHint" aria-label="Indice"><span class="bulb"></span></button>
    <div id="trash" aria-label="Poubelle"><span class="bin"></span></div>
    <div id="tip"></div>
    <div id="ghost"></div>
  </aside>
  <main class="stage">
    <div class="tname d" id="tname"></div>
    <div class="card" id="card"></div>
    <p class="msg" id="msg"></p>
  </main>
  <div class="finrow"><button class="fin ann" id="annBtn">Annuler tout changement</button><button class="fin" id="finBtn">Terminer la création du test</button></div>
</div>

<div id="play">
  <main class="stage">
    <div class="tname d" id="ptitle"></div>
    <div class="card" id="pcard"></div>
  </main>
  <button class="fin" id="pquit">Quitter l’essai</button>
</div>

<script>
const K = "braintest_editor_tests", MAXQ = 10, MAXC = 4;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tests = [], cur = null, qi = 0, editId = null, currentUserId = null;

async function loadUserTests(){
  if(!sb || !currentUserId) throw new Error("Aucun compte connecté.");
  const { data, error } = await sb.from("braintest_drafts")
    .select("local_id,name,questions,pub")
    .eq("user_id", currentUserId)
    .order("updated_at", { ascending:false });
  if(error) throw error;
  tests = (data || []).map(row => ({
    id: row.local_id, name: row.name, questions: row.questions,
    ...(row.pub ? { pub: row.pub } : {})
  }));
  renderList();
}

async function save(t){
  if(!sb || !currentUserId) throw new Error("Aucun compte connecté.");
  const { error } = await sb.from("braintest_drafts").upsert({
    user_id: currentUserId, local_id: t.id, name: t.name,
    questions: t.questions, pub: t.pub || null, updated_at: new Date().toISOString()
  }, { onConflict:"user_id,local_id" });
  if(error) throw error;
}

async function deleteDraft(id){
  if(!sb || !currentUserId) throw new Error("Aucun compte connecté.");
  const { error } = await sb.from("braintest_drafts")
    .delete().eq("user_id", currentUserId).eq("local_id", id);
  if(error) throw error;
}
function newQ(type){ return { type, text:"", choices: type === "text" ? [] : [{ t:"Choix 1", ok:false }], answer:"" }; }
const sig = t => JSON.stringify({ n: t.name, q: t.questions });
function show(v){ $("#home").style.display = v === "home" ? "flex" : "none"; $("#editor").style.display = v === "ed" ? "flex" : "none"; $("#play").style.display = v === "play" ? "flex" : "none"; document.querySelector(".corner").style.display = v === "ed" ? "none" : "block"; if(v !== "ed") endCarry(); const ub = $("#userBar"); if(ub) ub.style.display = v === "home" && window.api ? "flex" : "none"; }

/* ---------- Accueil ---------- */
function renderList(){
  const l = $("#list");
  l.innerHTML = tests.length
    ? tests.map(t => `<div class="t" data-id="${esc(t.id)}">${t.pub ? '<span class="pub" title="Test publié"></span>' : ""}${esc(t.name)}</div>`).join("")
    : '<p class="empty">Aucun test pour le moment. Clique sur + pour en créer un.</p>';
  l.querySelectorAll(".t").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const m = $("#tmenu"), r = el.getBoundingClientRect();
    m.style.left = r.left + "px"; m.style.top = (r.bottom + 6) + "px"; m.style.width = r.width + "px";
    m.dataset.id = el.dataset.id;
    const tt = tests.find(x => x.id === el.dataset.id);
    $("#tPub").textContent = tt && tt.pub ? "Mettre à jour la publication" : "Publier le test";
    $("#tPub").disabled = !!(tt && tt.pub && tt.pub.sig === sig(tt));
    m.classList.add("show");
  });
}
document.addEventListener("click", () => { $("#tmenu").classList.remove("show"); const q = $("#qmenu"); if(q) q.classList.remove("show"); });

$("#newBtn").onclick = () => { $("#nameIn").value = ""; $("#ov").classList.add("show"); $("#nameIn").focus(); };
$("#ov").onclick = e => { if(e.target === $("#ov")) $("#ov").classList.remove("show"); };
function createTest(){
  const name = $("#nameIn").value.trim();
  if(!name){ $("#nameIn").focus(); return; }
  cur = { id: Date.now().toString(36), name, questions:[newQ("single")] };
  editId = null; qi = 0;
  $("#ov").classList.remove("show");
  show("ed"); renderEd();
}
$("#createBtn").onclick = createTest;
$("#nameIn").onkeydown = e => { if(e.key === "Enter") createTest(); };
$("#tEdit").onclick = () => {
  const t = tests.find(x => x.id === $("#tmenu").dataset.id);
  if(!t) return;
  editId = t.id; cur = JSON.parse(JSON.stringify(t)); qi = 0;
  show("ed"); renderEd();
};

/* ---------- Essai du test ---------- */
let pt = null, pi = 0, pans = [], ptok = 0;
const norm = s => String(s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
$("#tTry").onclick = () => {
  const t = tests.find(x => x.id === $("#tmenu").dataset.id);
  if(t){ pt = t; pi = 0; pans = []; ptok++; show("play"); renderPlay(); }
};
function quitPlay(){ ptok++; pt = null; show("home"); }
$("#pquit").onclick = quitPlay;

function renderPlay(){
  $("#ptitle").textContent = pt.name + " · essai";
  const q = pt.questions[pi], n = pt.questions.length;
  let b = "";
  if(q.type === "text") b = '<input id="pans" class="ans" maxlength="80" placeholder="Ta réponse" autocomplete="off"><button class="vb go" id="pval">Valider</button>';
  else {
    b = q.choices.map((c, i) => { const m = q.type === "single" && q.mask === i; return `<div class="ch pc${m ? " mys" : ""}" data-i="${i}"><span class="l">${m ? "?" : esc(c.t)}</span></div>`; }).join("");
    if(q.type === "multi") b += '<button class="vb go" id="pval">Valider</button>';
  }
  const hh = q.hint && q.hint.text && q.hint.text.trim();
  $("#pcard").innerHTML = `<div class="prog">Question ${pi + 1} / ${n}</div><p class="pq">${esc(q.text)}</p>`
    + (hh ? `<p id="phint" style="display:none;text-align:center;color:#8a6d00;font-size:.85rem;font-weight:600;margin:-6px 8px 14px">Indice : ${esc(q.hint.text)}</p>` : "")
    + `<div class="opts">${b}</div><p class="msg" id="pfb"></p>`
    + (hh ? `<button class="hb ${q.hint.pos}" id="pbulb" aria-label="Voir l’indice"><span class="bulb"></span></button>` : "");
  const els = [...document.querySelectorAll(".pc")];
  const pb = $("#pbulb"); if(pb) pb.onclick = () => { const h = $("#phint"); h.style.display = h.style.display === "none" ? "block" : "none"; };
  let done = false;
  const endQ = (good, fb) => {
    done = true; pans[pi] = good; const k = ptok;
    $("#pfb").style.color = good ? "#3f7a2b" : "#c0342c";
    $("#pfb").textContent = fb;
    setTimeout(() => { if(k !== ptok) return; pi++; pi < n ? renderPlay() : endPlay(); }, 1100);
  };
  if(q.type === "single"){
    els.forEach(d => d.onclick = () => {
      if(done) return;
      const c = q.choices[d.dataset.i];
      const my = document.querySelector(".mys");
      if(my){ my.querySelector(".l").textContent = q.choices[my.dataset.i].t; my.classList.remove("mys"); }
      els.forEach(e => { if(q.choices[e.dataset.i].ok) e.classList.add("on"); });
      if(!c.ok) d.classList.add("bad");
      endQ(c.ok, c.ok ? "Bonne réponse !" : "Pas tout à fait…");
    });
  } else if(q.type === "multi"){
    els.forEach(d => d.onclick = () => { if(!done) d.classList.toggle("sel"); });
    $("#pval").onclick = () => {
      if(done) return;
      let good = true;
      els.forEach(d => {
        const c = q.choices[d.dataset.i], sel = d.classList.contains("sel");
        if(c.ok !== sel) good = false;
        d.classList.remove("sel");
        if(c.ok) d.classList.add("on"); else if(sel) d.classList.add("bad");
      });
      endQ(good, good ? "Bonne réponse !" : "Pas tout à fait…");
    };
  } else {
    const inp = $("#pans");
    const go = () => {
      if(done) return;
      const good = norm(inp.value) === norm(q.answer);
      inp.disabled = true;
      endQ(good, good ? "Bonne réponse !" : "La réponse était : " + q.answer);
    };
    $("#pval").onclick = go;
    inp.onkeydown = e => { if(e.key === "Enter") go(); };
    inp.focus();
  }
}

function endPlay(){
  const n = pt.questions.length, g = pans.filter(Boolean).length;
  const rec = pt.questions.map((q, i) => {
    const ans = q.type === "text" ? q.answer : q.choices.filter(c => c.ok).map(c => c.t).join(", ");
    return `<div class="rec ${pans[i] ? "ok" : "ko"}">${i + 1}. ${esc(q.text)}<br><small>Bonne réponse : ${esc(ans)}</small></div>`;
  }).join("");
  $("#pcard").innerHTML = `<div class="prog">Essai terminé</div><p class="pq">${g} / ${n} bonnes réponses</p><div class="opts">${rec}</div><button class="vb go" id="pback">Retour aux tests</button>`;
  $("#pback").onclick = quitPlay;
}

/* ---------- Publication (Supabase) ---------- */
const SB_URL = "https://alrcdwhyrgqqrfyxqklg.supabase.co", SB_KEY = "sb_publishable_AXSZBIjcBZbAVosgFccfYQ_dUVhaXa0";
let sb = null, pubId = null;
try{ sb = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } }); }catch(e){}
const newKey = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
$("#tPub").onclick = () => {
  const t = tests.find(x => x.id === $("#tmenu").dataset.id);
  if(!t) return;
  pubId = t.id; $("#pAcc").checked = false; $("#pYes").disabled = true; $("#pMsg").textContent = "";
  $("#pov").classList.add("show");
};
$("#pAcc").onchange = e => { $("#pYes").disabled = !e.target.checked; };
$("#pNo").onclick = () => $("#pov").classList.remove("show");
$("#pov").onclick = e => { if(e.target === $("#pov")) $("#pov").classList.remove("show"); };
$("#pYes").onclick = async () => {
  const t = tests.find(x => x.id === pubId), msg = $("#pMsg");
  if(!t) return;
  if(!sb){ msg.style.color = "#c0342c"; msg.textContent = "Connexion impossible : vérifie ta connexion internet."; return; }
  $("#pYes").disabled = true; msg.style.color = "#26261f"; msg.textContent = "Publication…";
  const key = (t.pub && t.pub.key) || null;
  const { data, error } = await sb.rpc("publish_quiz", { p_id: t.pub ? t.pub.id : null, p_key: key, p_name: t.name, p_questions: t.questions });
  if(error){ msg.style.color = "#c0342c"; msg.textContent = "Erreur : " + (error.message || "inconnue"); $("#pYes").disabled = false; return; }
  t.pub = { id: data, key, sig: sig(t) }; try{ await save(t); }catch(e){ msg.style.color = "#c0342c"; msg.textContent = "Test publié, mais sauvegarde du brouillon impossible : " + (e.message || "erreur"); $("#pYes").disabled = false; return; } renderList();
  $("#pov").classList.remove("show");
};

let delId = null;
$("#tDel").onclick = () => {
  const t = tests.find(x => x.id === $("#tmenu").dataset.id);
  if(!t) return;
  delId = t.id;
  $("#cmsg").textContent = "Supprimer définitivement le test « " + t.name + " » ?";
  $("#cov").classList.add("show");
};
$("#cNo").onclick = () => $("#cov").classList.remove("show");
$("#cov").onclick = e => { if(e.target === $("#cov")) $("#cov").classList.remove("show"); };
$("#cYes").onclick = async () => {
  const t = tests.find(x => x.id === delId);
  if(t && t.pub){
    if(!sb){ $("#cmsg").textContent = "Connexion impossible : le test publié ne peut pas être retiré."; return; }
    const { error } = await sb.rpc("unpublish_quiz", { p_id: t.pub.id, p_key: t.pub.key || null });
    if(error){ $("#cmsg").textContent = "Impossible de dépublier : " + (error.message || "erreur inconnue"); return; }
  }
  tests = tests.filter(x => x.id !== delId);
  try{ await deleteDraft(delId); }catch(e){ $("#cmsg").textContent = "Impossible de supprimer le brouillon : " + (e.message || "erreur inconnue"); return; }
  renderList();
  $("#cov").classList.remove("show");
};

/* ---------- Éditeur ---------- */
function renderEd(){
  $("#msg").textContent = "";
  $("#tname").textContent = cur.name;
  const n = cur.questions.length, q = cur.questions[qi], last = qi === n - 1;
  const lbl = { single:"Choix unique", multi:"Choix multiples", text:"Réponse écrite" }[q.type];
  let b = "";
  if(q.type === "text"){
    b = `<input id="ans" class="ans" maxlength="80" placeholder="Écris ici la bonne réponse" value="${esc(q.answer)}"><button class="vb" tabindex="-1">Valider</button>`;
  } else {
    b = q.choices.map((c, i) => `<div class="ch${c.ok ? " on" : ""}" data-i="${i}"><input maxlength="60" value="${esc(c.t)}">${q.choices.length > 1 ? '<span class="x" title="Supprimer ce choix">✕</span>' : ""}${q.mask === i ? '<span class="mk" data-mk>?</span>' : ""}</div>`).join("");
    if(q.choices.length < MAXC) b += '<button class="addc" id="addc">+</button>';
    if(q.type === "multi") b += '<button class="vb" tabindex="-1">Valider</button>';
    b += '<p class="hint">Clique sur le contour d’un choix pour en faire la bonne réponse (re-clique pour annuler), ou sur le texte pour le modifier. Le ✕ supprime un choix.</p>';
  }
  const hp = q.hint ? q.hint.pos : null;
  const cell = p => `<div class="hcell${hp === p ? " has" : ""}" data-p="${p}">${hp === p ? '<span class="bulb" data-bulb></span>' : ""}</div>`;
  const hin = hp ? `<input class="hin" id="hin" data-p="${hp}" maxlength="100" placeholder="Écris ton indice ici" value="${esc(q.hint.text || "")}">` : "";
  $("#card").innerHTML = `
    <div class="prog">Question ${qi + 1} / ${MAXQ} · ${lbl}</div>
    <textarea id="qt" class="qt" rows="2" maxlength="200" placeholder="Écris ta question ici">${esc(q.text)}</textarea>
    <div class="opts">${b}</div>
    <div class="foot">
      <button class="nav del" id="qdel" aria-label="Supprimer cette question" ${n < 2 ? "disabled" : ""}><span class="bin"></span></button>
      <div class="ngrp">
        <button class="nav l" id="prev" aria-label="Question précédente" ${qi === 0 ? "disabled" : ""}></button>
        <button class="nav ${last ? "p" : "r"}" id="nxt" aria-label="${last ? "Ajouter une question" : "Question suivante"}" ${last && n >= MAXQ ? "disabled" : ""}></button>
      </div>
      <div class="qmenu" id="qmenu">
        <button data-t="single">Question à choix unique</button>
        <button data-t="multi">Question à choix multiples</button>
        <button data-t="text">Question avec champ de texte</button>
      </div>
      ${cell("l")}${cell("r")}${hin}
    </div>`;

  $("#qt").oninput = e => { q.text = e.target.value; };
  const hi = $("#hin");
  if(hi){ hi.oninput = e => { q.hint.text = e.target.value; }; if(focusHint){ hi.focus(); focusHint = false; } }
  const mkEl = document.querySelector("[data-mk]"); if(mkEl) mkEl.onpointerdown = e => pickExisting(e, "mask");
  const buEl = document.querySelector("[data-bulb]"); if(buEl) buEl.onpointerdown = e => pickExisting(e, "hint");
  $("#tMask").classList.toggle("off", q.type !== "single");
  const a = $("#ans"); if(a) a.oninput = e => { q.answer = e.target.value; };
  document.querySelectorAll(".ch").forEach(d => {
    const c = q.choices[d.dataset.i];
    d.querySelector("input").oninput = e => { c.t = e.target.value; };
    d.onclick = e => {
      if(e.target.tagName === "INPUT") return;
      if(e.target.classList.contains("x")){ const di = +d.dataset.i; q.choices.splice(di, 1); if(q.mask === di) delete q.mask; else if(q.mask > di) q.mask--; let k = 0; const mx = Math.max(1, q.choices.length - 1); q.choices.forEach(x => { if(x.ok && ++k > mx) x.ok = false; }); renderEd(); return; }
      if(q.type === "single"){ const was = c.ok; q.choices.forEach(x => x.ok = false); c.ok = !was; }
      else {
        const mx = Math.max(1, q.choices.length - 1);
        if(!c.ok && q.choices.filter(x => x.ok).length >= mx){
          renderEd();
          $("#msg").textContent = "Maximum " + mx + " bonne" + (mx > 1 ? "s" : "") + " réponse" + (mx > 1 ? "s" : "") + " pour " + q.choices.length + " choix.";
          return;
        }
        c.ok = !c.ok;
      }
      renderEd();
    };
  });
  const ac = $("#addc");
  if(ac) ac.onclick = () => { q.choices.push({ t:"Choix " + (q.choices.length + 1), ok:false }); renderEd(); };
  $("#prev").onclick = () => { qi--; renderEd(); };
  $("#qdel").onclick = () => {
    if(cur.questions.length < 2) return;
    ask("Supprimer cette question ?", "Annuler", "Supprimer", () => {
      cur.questions.splice(qi, 1); qi = Math.min(qi, cur.questions.length - 1); renderEd();
    });
  };
  $("#nxt").onclick = e => {
    e.stopPropagation();
    if(!last){ qi++; renderEd(); } else $("#qmenu").classList.toggle("show");
  };
  $("#qmenu").querySelectorAll("button").forEach(btn => btn.onclick = () => {
    cur.questions.push(newQ(btn.dataset.t)); qi = cur.questions.length - 1; renderEd();
  });
}

/* ---------- Outils : cache ? et indice ---------- */
let carry = null, moved = false, justPicked = false, suppress = false, focusHint = false, sx = 0, sy = 0;
const ghost = $("#ghost"), tip = $("#tip");
const TIPS = {
  tMask: "Ceci est un cache choix, il permet de cacher un choix dans une question à choix unique pour rendre la question plus difficile.",
  tHint: "Ceci est un indice, il permet d’ajouter un indice à la question, quel que soit son type."
};
["tMask", "tHint"].forEach(id => {
  const b = $("#" + id);
  b.onmouseenter = () => { const r = b.getBoundingClientRect(); tip.textContent = TIPS[id]; tip.style.left = (r.right + 8) + "px"; tip.style.top = r.top + "px"; tip.style.display = "block"; };
  b.onmouseleave = () => { tip.style.display = "none"; };
  b.onpointerdown = e => { if(!b.classList.contains("off")) startCarry(e, id === "tMask" ? "mask" : "hint", null); };
});
function moveGhost(e){ ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px"; }
function block(){ suppress = true; setTimeout(() => { suppress = false; }, 0); }
function startCarry(e, kind, orig){
  carry = { kind, orig, text: orig && orig.text ? orig.text : "" };
  ghost.className = "gh-" + kind;
  ghost.innerHTML = kind === "mask" ? "?" : '<span class="bulb"></span>';
  ghost.style.display = "block";
  document.body.classList.toggle("carry-hint", kind === "hint");
  if(orig) $("#trash").classList.add("hot");
  moveGhost(e); sx = e.clientX; sy = e.clientY; moved = false; justPicked = true;
  tip.style.display = "none"; e.preventDefault();
}
function pickExisting(e, kind){
  const q = cur.questions[qi];
  const orig = kind === "mask" ? { i: q.mask } : { pos: q.hint.pos, text: q.hint.text };
  if(kind === "mask") delete q.mask; else delete q.hint;
  renderEd();
  startCarry(e, kind, orig);
}
function endCarry(){
  carry = null; ghost.style.display = "none";
  document.body.classList.remove("carry-hint"); $("#trash").classList.remove("hot");
}
function restoreOrig(c, q){
  if(!c.orig) return;
  if(c.kind === "mask") q.mask = c.orig.i; else q.hint = { pos: c.orig.pos, text: c.orig.text };
}
function dropCarry(e){
  const c = carry, q = cur.questions[qi];
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const ch = el && el.closest(".ch"), cl = el && el.closest(".hcell"), tr = el && el.closest("#trash");
  endCarry(); block();
  if(c.kind === "mask" && ch && q.type === "single") q.mask = +ch.dataset.i;
  else if(c.kind === "hint" && cl){ q.hint = { pos: cl.dataset.p, text: c.text || (q.hint && q.hint.text) || "" }; focusHint = true; }
  else if(!tr) restoreOrig(c, q);
  renderEd();
}
document.addEventListener("pointermove", e => {
  if(!carry) return;
  moveGhost(e);
  if(Math.hypot(e.clientX - sx, e.clientY - sy) > 6) moved = true;
});
document.addEventListener("pointerdown", e => { if(carry && !justPicked) e.preventDefault(); }, true);
document.addEventListener("pointerup", e => {
  if(!carry) return;
  if(justPicked){ justPicked = false; if(!moved){ block(); return; } }
  dropCarry(e);
});
document.addEventListener("click", e => { if(suppress){ e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener("keydown", e => {
  if(e.key !== "Escape" || !carry) return;
  const c = carry, q = cur.questions[qi];
  endCarry(); restoreOrig(c, q); renderEd();
});

/* ---------- Confirmation et annulation ---------- */
let aCb = null;
function ask(msg, noLbl, yesLbl, cb){
  $("#amsg").textContent = msg; $("#aNo").textContent = noLbl; $("#aYes").textContent = yesLbl;
  aCb = cb; $("#aov").classList.add("show");
}
$("#aNo").onclick = () => $("#aov").classList.remove("show");
$("#aov").onclick = e => { if(e.target === $("#aov")) $("#aov").classList.remove("show"); };
$("#aYes").onclick = () => { $("#aov").classList.remove("show"); const f = aCb; aCb = null; if(f) f(); };
$("#annBtn").onclick = () => {
  const orig = editId ? tests.find(x => x.id === editId) : null;
  const leave = () => { cur = null; editId = null; show("home"); };
  if(orig && sig(orig) === sig(cur)) leave();
  else ask(editId ? "Annuler toutes les modifications de ce test ?" : "Quitter sans enregistrer ce test ?", "Continuer l’édition", "Annuler les modifications", leave);
};

$("#finBtn").onclick = async () => {
  for(let i = 0; i < cur.questions.length; i++){
    const q = cur.questions[i]; let p = "";
    if(!q.text.trim()) p = "écris la question.";
    else if(q.type === "text" ? !q.answer.trim() : !q.choices.some(c => c.ok)) p = q.type === "text" ? "écris la bonne réponse." : "choisis la bonne réponse.";
    else if(q.type !== "text" && q.choices.some(c => !c.t.trim())) p = "un choix est vide.";
    if(p){ qi = i; renderEd(); $("#msg").textContent = "Question " + (i + 1) + " : " + p; return; }
  }
  const finished = cur;
  if(editId) tests = tests.map(t => t.id === editId ? finished : t); else tests.push(finished);
  try{ await save(finished); }catch(e){ $("#msg").textContent = "Impossible d’enregistrer le test dans ton compte : " + (e.message || "erreur inconnue"); return; }
  cur = null; editId = null;
  renderList(); show("home");
};

renderList();

  try{ await sb.auth.signOut({ scope: "local" }); }catch(e){}
