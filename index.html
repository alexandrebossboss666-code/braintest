<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de réflexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --card-bg:#E7E7E5;
    --card-border:#5c5c58;
    --btn-gray:#c7c7c4;
    --btn-gray-text:#6b6b67;
    --accent:#FFBA6B;
    --accent-dark:#e8a04f;
    --sky:#BFE3F5;
    --ink:#26261f;
    --nulle:#adadaa;
    --mauvaise:#e05252;
    --mediocre:#ef9d3c;
    --bonne:#8bc46a;
    --extra:#2f7d3c;
  }
  *{box-sizing:border-box;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  body{
    margin:0;
    min-height:100vh;
    background:#ffffff;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:40px;
    padding:40px 56px;
    position:relative;
    overflow-x:hidden;
  }
  h1,h2,.display{
    font-family:'Space Grotesk',sans-serif;
  }

  /* ---------- Carte centrale ---------- */
  .card{
    background:var(--card-bg);
    border:2px solid var(--card-border);
    border-radius:22px;
    width:520px;
    max-width:88vw;
    min-height:340px;
    padding:28px 32px 24px;
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
  }
  .card h1{
    text-align:center;
    font-size:1.5rem;
    margin:0 0 22px;
    letter-spacing:0.01em;
  }

  /* ---------- Formulaire d'inscription ---------- */
  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:0.85rem;
    font-weight:600;
    margin-bottom:6px;
  }
  .field label .req{
    color:#d13b3b;
    margin-left:2px;
  }
  .field input, .field select{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid #9b9b96;
    background:#fbfbfa;
    font-family:'Inter',sans-serif;
    font-size:0.95rem;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{
    outline:2px solid var(--accent-dark);
    outline-offset:1px;
  }

  .start-row{
    margin-top:auto;
    display:flex;
    justify-content:flex-end;
    padding-top:10px;
  }

  /* ---------- Champ photo (optionnel) ---------- */
  .photo-field{ margin-bottom:16px; }
  .photo-field label{
    display:block;
    font-size:0.85rem;
    font-weight:600;
    margin-bottom:8px;
  }
  .photo-add-btn{
    width:56px;
    height:56px;
    border-radius:14px;
    background:#5c5c58;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    padding:0;
  }
  .photo-add-btn::before, .photo-add-btn::after{
    content:'';
    position:absolute;
    background:#141412;
    border-radius:2px;
  }
  .photo-add-btn::before{ width:22px; height:4px; }
  .photo-add-btn::after{ width:4px; height:22px; }
  .photo-add-btn:hover{ background:#4a4a47; }
  .photo-preview-wrap{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .photo-preview{
    width:56px;
    height:56px;
    border-radius:14px;
    object-fit:cover;
    border:1.5px solid #4d4d49;
  }
  .photo-remove{
    font-size:0.78rem;
    font-weight:600;
    color:#c0342c;
    cursor:pointer;
    text-decoration:underline;
  }

  /* ---------- Case "Ne pas enregistrer sur le serveur" ---------- */
  .local-only-field{
    display:flex;
    align-items:flex-start;
    gap:9px;
    margin-bottom:16px;
  }
  .local-only-field input[type="checkbox"]{
    margin-top:2px;
    width:16px;
    height:16px;
    accent-color:var(--accent-dark);
    cursor:pointer;
    flex-shrink:0;
  }
  .local-only-field label{
    font-size:0.82rem;
    font-weight:600;
    line-height:1.35;
    cursor:pointer;
  }

  /* ---------- Bouton Mode expert ---------- */
  .expert-row{ margin-bottom:16px; }
  #expertModeBtn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:11px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:0.9rem;
    cursor:pointer;
    background:#c0342c;
    color:#fff;
    transition:background .2s ease;
  }
  #expertModeBtn.active{
    background:#2f5fa3;
  }

  /* ---------- Verrou du mode expert ---------- */
  .expert-lock-wrap{
    position:relative;
  }
  .expert-lock-overlay{
    position:absolute;
    inset:0;
    border-radius:14px;
    border:1.5px solid #1c1c18;
    background-image:repeating-linear-gradient(135deg, transparent, transparent 6px, rgba(20,20,18,0.6) 6px, rgba(20,20,18,0.6) 7px);
    cursor:not-allowed;
  }
  .expert-lock-tooltip{
    position:absolute;
    bottom:calc(100% + 10px);
    left:50%;
    transform:translateX(-50%);
    background:#2a1414;
    color:#fff;
    padding:10px 14px;
    border-radius:10px;
    font-size:0.76rem;
    font-weight:600;
    line-height:1.35;
    width:230px;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
    z-index:10;
  }
  .expert-lock-tooltip::after{
    content:'';
    position:absolute;
    top:100%; left:50%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:#2a1414;
  }
  .expert-lock-overlay:hover .expert-lock-tooltip{
    opacity:1;
  }

  /* ---------- Étiquette de mode (bilan) ---------- */
  .mode-tag{
    position:absolute;
    top:14px; left:16px;
    padding:5px 12px;
    border-radius:10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:0.7rem;
    color:#fff;
  }
  .mode-tag.normal{ background:#2f5fa3; }
  .mode-tag.expert{ background:#c0342c; }

  /* ---------- Champ code hex (mode expert) ---------- */
  .hex-input-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:12px;
  }
  .hex-input-row input{
    width:130px;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid #9b9b96;
    background:#fbfbfa;
    font-family:'Space Grotesk',sans-serif;
    font-size:0.95rem;
    text-align:center;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .hex-input-row input:focus{
    outline:2px solid var(--accent-dark);
    outline-offset:1px;
  }

  /* ---------- Minuteur (mode expert) ---------- */
  .timer-display{
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:#c0342c;
    margin-bottom:10px;
  }
  #startBtn{
    border:none;
    border-radius:14px;
    padding:12px 26px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    cursor:not-allowed;
    background:var(--btn-gray);
    color:var(--btn-gray-text);
    transition:background .2s ease, color .2s ease, transform .1s ease;
  }
  #startBtn.enabled{
    background:var(--accent);
    color:#3a2408;
    cursor:pointer;
  }
  #startBtn.enabled:hover{
    background:var(--accent-dark);
  }
  #startBtn:active.enabled{
    transform:scale(0.97);
  }

  /* ---------- Questions logo ---------- */
  .quiz-progress{
    text-align:center;
    font-size:0.75rem;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#6b6b67;
    margin-bottom:14px;
  }
  .logo-square{
    width:150px;
    height:150px;
    margin:6px auto 18px;
    border-radius:12px;
    border:1.5px solid #4d4d49;
  }
  .question-text{
    text-align:center;
    font-weight:600;
    font-size:1.05rem;
    margin:0 0 20px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:center;
  }
  .opt-btn{
    width:78%;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid #8f8f8a;
    background:var(--btn-gray);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .opt-btn:hover{ background:#b7b7b3; }
  .opt-btn:active{ transform:scale(0.98); }
  .opt-btn.correct{ background:var(--bonne); border-color:#3f7a2b; color:#153c0c; }
  .opt-btn.wrong{ background:var(--mauvaise); border-color:#9c2b2b; color:#4a0f0f; }
  .opt-btn.disabled{ pointer-events:none; opacity:0.85; }

  /* ---------- Questions couleur ---------- */
  .color-rect{
    width:220px;
    height:120px;
    margin:6px auto 20px;
    border-radius:12px;
    border:1.5px solid #4d4d49;
  }
  .color-pick-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:22px;
  }
  .color-pick-row input[type="color"]{
    width:64px;
    height:44px;
    border-radius:10px;
    border:1.5px solid #8f8f8a;
    background:none;
    cursor:pointer;
    padding:2px;
  }
  #validateColorBtn{
    border:none;
    border-radius:14px;
    padding:12px 22px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    background:var(--accent);
    color:#3a2408;
  }
  #validateColorBtn:hover{ background:var(--accent-dark); }

  .feedback-flash{
    text-align:center;
    font-size:0.85rem;
    font-weight:600;
    min-height:1.2em;
    margin-top:10px;
    color:#4a7a3a;
  }

  /* ---------- Questions notes ---------- */
  .play-wrap{
    display:flex;
    justify-content:center;
    margin:10px auto 22px;
  }
  .play-btn{
    width:0;
    height:0;
    border-top:22px solid transparent;
    border-bottom:22px solid transparent;
    border-left:36px solid var(--btn-gray);
    cursor:pointer;
    transition:border-left-color .15s ease, transform .1s ease;
  }
  .play-btn:hover{ border-left-color:#b7b7b3; }
  .play-btn:active{ transform:scale(0.94); }

  .note-bands{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
  }
  .note-band{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#8FC7EC;
    border:2px solid #1c1c18;
    border-radius:12px;
    padding:10px 14px;
    transition:box-shadow .15s ease, opacity .15s ease;
  }
  .note-band .note-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    color:#0f2233;
    letter-spacing:0.02em;
  }
  .note-band .drag-handle{
    display:flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border-radius:8px;
    background:#ffffffaa;
    color:#0f2233;
    font-size:1rem;
    line-height:1;
    letter-spacing:2px;
    cursor:grab;
    touch-action:none;
    user-select:none;
  }
  .note-band .drag-handle:hover{ background:#ffffff; }
  .note-band.dragging{
    box-shadow:0 14px 26px rgba(0,0,0,0.28);
    z-index:1000;
  }
  .note-band.dragging .drag-handle{ cursor:grabbing; }
  .note-band.drop-locked .drag-handle{ cursor:default; opacity:0.3; pointer-events:none; }
  .note-band-placeholder{
    border:2px dashed var(--accent-dark);
    border-radius:12px;
    background:rgba(255,186,107,0.15);
    box-sizing:border-box;
  }

  #validateOrderBtn{
    display:block;
    margin:0 auto;
    border:none;
    border-radius:14px;
    padding:12px 22px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    background:var(--accent);
    color:#3a2408;
  }
  #validateOrderBtn:hover{ background:var(--accent-dark); }

  /* ---------- Colonne Bilan (droite) ---------- */
  .right-column{
    display:flex;
    flex-direction:column;
    gap:20px;
    width:220px;
    flex-shrink:0;
  }
  .bilan-column{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .bilan-panel{
    border:2px solid #1c1c18;
    border-radius:20px;
    background:#ffffff;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    max-height:320px;
  }
  .bilan-panel h2{
    text-align:center;
    font-size:1.05rem;
    margin:0;
    padding:16px 10px 12px;
    border-bottom:2px solid #1c1c18;
  }
  .bilan-list{
    overflow-y:auto;
    padding:12px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .bilan-empty{
    font-size:0.8rem;
    color:#8a8a85;
    text-align:center;
    margin-top:20px;
    padding:0 8px 20px;
  }
  .bilan-item{
    position:relative;
    background:var(--sky);
    border-radius:12px;
    padding:14px 10px 10px;
    text-align:center;
    cursor:pointer;
    font-weight:700;
    font-family:'Space Grotesk',sans-serif;
    transition:transform .1s ease;
  }
  .bilan-item:hover{ transform:translateY(-2px); }
  .bilan-item .trash{
    position:absolute;
    top:6px;
    left:8px;
    cursor:pointer;
    font-size:0.9rem;
    line-height:1;
  }
  .bilan-item .sub{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:0.7rem;
    color:#2b4a5c;
    margin-top:4px;
    letter-spacing:0.05em;
  }

  /* ---------- Recherche par code ---------- */
  .bilan-search-box{
    border:2px solid #1c1c18;
    border-radius:20px;
    background:#ffffff;
    padding:14px 14px 16px;
  }
  .bilan-search-box label{
    display:block;
    font-size:0.78rem;
    font-weight:600;
    text-align:center;
    margin-bottom:10px;
    line-height:1.25;
  }
  .bilan-search-box input{
    width:100%;
    padding:9px 10px;
    border-radius:10px;
    border:1.5px solid #9b9b96;
    background:#fbfbfa;
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    text-align:center;
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:10px;
  }
  .bilan-search-box input:focus{
    outline:2px solid var(--accent-dark);
    outline-offset:1px;
  }
  #findCodeBtn{
    width:100%;
    border:none;
    border-radius:12px;
    padding:9px 10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:0.88rem;
    cursor:pointer;
    background:var(--accent);
    color:#3a2408;
  }
  #findCodeBtn:hover{ background:var(--accent-dark); }
  .code-msg{
    text-align:center;
    font-size:0.78rem;
    font-weight:600;
    margin:10px 0 0;
    min-height:1.1em;
  }
  .code-msg.error{ color:#c0342c; }
  .code-msg.info{ color:#3a6ea5; }
  .code-msg.success{ color:#3f7a2b; }

  /* ---------- Badge d'erreur (rond rouge avec !) ---------- */
  .error-line{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    text-align:left;
  }
  .error-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:16px;
    height:16px;
    min-width:16px;
    border-radius:50%;
    background:#c0342c;
    color:#fff;
    font-size:0.68rem;
    font-weight:800;
    font-family:'Space Grotesk',sans-serif;
  }

  /* ---------- Verrou de maintenance ---------- */
  .card-wrap{ position:relative; }
  .bilan-search-box{ position:relative; }
  .locked-overlay{
    position:absolute;
    inset:0;
    border-radius:inherit;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    background:rgba(231,231,229,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:6;
  }
  .lock-icon{ position:relative; width:44px; height:52px; }
  .lock-icon .shackle{
    position:absolute; top:0; left:8px;
    width:28px; height:24px;
    border:6px solid #c0342c;
    border-bottom:none;
    border-radius:15px 15px 0 0;
    box-sizing:border-box;
  }
  .lock-icon .body{
    position:absolute; bottom:0; left:0;
    width:44px; height:29px;
    background:#c0342c;
    border-radius:7px;
  }
  .lock-icon .hole{
    position:absolute; top:8px; left:50%;
    transform:translateX(-50%);
    width:7px; height:7px;
    background:#fdf1f0;
    border-radius:50%;
  }
  .lock-icon .hole::after{
    content:'';
    position:absolute; top:5px; left:50%;
    transform:translateX(-50%);
    width:3px; height:7px;
    background:#fdf1f0;
  }
  .lock-tooltip{
    position:absolute;
    bottom:105%; left:50%;
    transform:translateX(-50%);
    background:#2a1414;
    color:#fff;
    padding:10px 14px;
    border-radius:10px;
    font-size:0.76rem;
    font-weight:600;
    width:210px;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
    z-index:10;
  }
  .lock-tooltip::after{
    content:'';
    position:absolute; top:100%; left:50%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:#2a1414;
  }
  .lock-tooltip.show{ opacity:1; }

  #maintenanceBanner{
    position:fixed;
    top:0; left:0; right:0;
    background:#c0342c;
    color:#fff;
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:1.15rem;
    padding:16px 12px;
    letter-spacing:0.01em;
    z-index:20;
  }

  /* ---------- Boîte avis (bas gauche) ---------- */
  .avis-box{
    width:100%;
    border:2px solid #1c1c18;
    border-radius:20px;
    background:#ffffff;
    padding:16px 16px 18px;
  }
  .avis-box h2{
    font-size:0.95rem;
    text-align:center;
    margin:0 0 10px;
  }
  .avis-box textarea{
    width:100%;
    min-height:80px;
    resize:vertical;
    border-radius:10px;
    border:1.5px solid #9b9b96;
    background:#fbfbfa;
    font-family:'Inter',sans-serif;
    font-size:0.85rem;
    padding:8px 10px;
    margin-bottom:10px;
  }
  .avis-box textarea:focus{
    outline:2px solid var(--accent-dark);
    outline-offset:1px;
  }
  #sendAvisBtn{
    width:100%;
    border:none;
    border-radius:12px;
    padding:9px 10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:0.88rem;
    cursor:pointer;
    background:var(--accent);
    color:#3a2408;
  }
  #sendAvisBtn:hover{ background:var(--accent-dark); }
  .avis-msg{
    text-align:center;
    font-size:0.75rem;
    font-weight:600;
    margin:10px 0 0;
    min-height:1.1em;
    color:#3f7a2b;
  }

  @media (max-width:760px){
    .right-column{ width:88vw; max-width:520px; }
  }

  /* ---------- Lien "Fonctionnement du site" (sous le formulaire) ---------- */
  .info-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:16px;
    cursor:pointer;
  }
  .info-row span.info-label{
    font-size:0.82rem;
    font-weight:600;
    color:#4d4d49;
  }
  .info-circle{
    width:18px;
    height:18px;
    border-radius:50%;
    border:1.5px solid #4d4d49;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:0.7rem;
    color:#4d4d49;
    flex-shrink:0;
  }
  .info-row:hover .info-label,
  .info-row:hover .info-circle{ color:var(--accent-dark); border-color:var(--accent-dark); }

  /* ---------- Carte "Fonctionnement du site" ---------- */
  .info-sheet h2{
    text-align:center;
    font-weight:700;
    font-size:1.2rem;
    margin:0 0 18px;
  }

let audioCtx = null;
function playTone(freq, duration = 0.55){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.28, now + 0.03);
  gain.gain.linearRampToValueAtTime(0, now + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + duration + 0.02);
}
function playSequence(noteNames, gap = 0.65){
  noteNames.forEach((n, i) => {
    setTimeout(() => playTone(NOTES[n]), i * gap * 1000);
  });
}
function playChord(chordName, duration = 0.9){
  const notes = CHORDS[chordName] || [];
  notes.forEach(n => playTone(NOTES[n], duration));
}
function playChordSequence(chordNames, gap = 1.1){
  chordNames.forEach((c, i) => {

  });
}
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ===================== Compression de la photo avant envoi ===================== */
function compressImage(file, maxDimension = 1400, quality = 0.8){
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => {
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDimension || height > maxDimension){
          if(width > height){
            height = Math.round(height * (maxDimension / width));
            width = maxDimension;
          } else {
            width = Math.round(width * (maxDimension / height));
            height = maxDimension;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if(!blob){ resolve(file); return; }
          resolve(new File([blob], (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' }));
        }, 'image/jpeg', quality);
      };
      img.onerror = () => resolve(file);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(file);
    reader.readAsDataURL(file);
  });
}

  const r = Math.floor(Math.random()*256);
  const g = Math.floor(Math.random()*256);
  const b = Math.floor(Math.random()*256);
  return {r,g,b, hex: rgbToHex(r,g,b)};
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}
function hexToRgb(hex){
  const m = hex.replace('#','');
  return {
    r: parseInt(m.substring(0,2),16),
    g: parseInt(m.substring(2,4),16),
    b: parseInt(m.substring(4,6),16)
  };
}
function colorCloseness(c1, c2){
  const dist = Math.sqrt((c1.r-c2.r)**2 + (c1.g-c2.g)**2 + (c1.b-c2.b)**2);
  const maxDist = Math.sqrt(255**2 * 3);
  return Math.max(0, 100 * (1 - dist / maxDist));
}
function perturbColor(base, maxDelta){
  const clamp = (v) => Math.max(0, Math.min(255, v));
  const r = clamp(base.r + Math.round((Math.random() * 2 - 1) * maxDelta));
  const g = clamp(base.g + Math.round((Math.random() * 2 - 1) * maxDelta));
  const b = clamp(base.b + Math.round((Math.random() * 2 - 1) * maxDelta));
  const rgb = { r, g, b };
  return { hex: rgbToHex(r, g, b), rgb };
}

        if(correct){
          btn.classList.add('correct');
          document.getElementById('feedback').textContent = 'Bonne réponse !';
        } else {
          btn.classList.add('wrong');
          buttons.forEach(b => { if(options[b.dataset.opt].hex === currentRandomColor.hex) b.classList.add('correct'); });
          document.getElementById('feedback').textContent = 'Pas tout à fait…';
        }
        setTimeout(() => {
          if(testEnded) return;
          if(index + 1 < NUM_COLOR_QUESTIONS){
            renderColorQuestion(index + 1);
          } else {
            renderNoteSingleQuestion(0);
          }
        }, 900);
      });
    });
    return;
  }

  card.innerHTML = `
    ${timerHTML()}
    <div class="quiz-progress">Question ${index+5} / ${TOTAL_QUESTIONS}</div>
    <div class="color-rect" style="background:${currentRandomColor.hex}"></div>
    <p class="question-text">Trouve la bonne couleur</p>
    <div class="color-pick-row">
      <input type="color" id="colorInput" value="#808080">
      <button id="validateColorBtn">Valider</button>
    </div>
    <p class="feedback-flash" id="feedback"></p>
  `;
  updateTimerDisplay();

  document.getElementById('validateColorBtn').addEventListener('click', () => {
    const picked = hexToRgb(document.getElementById('colorInput').value);
    const score = colorCloseness(currentRandomColor, picked);
    colorScores.push(score);
    document.getElementById('feedback').textContent = `Proximité : ${score.toFixed(0)}%`;
    document.getElementById('validateColorBtn').disabled = true;
    document.getElementById('colorInput').disabled = true;
    setTimeout(() => {
      if(testEnded) return;
      if(index + 1 < NUM_COLOR_QUESTIONS){
        renderColorQuestion(index + 1);
      } else {
        renderNoteSingleQuestion(0);
      }
    }, 700);
  });
}

/* ===================== Questions notes simples / accords (9-10) ===================== */
function renderNoteSingleQuestion(index){
  const pool = testIsExpert ? CHORD_NAMES : NOTE_NAMES;
  const target = pool[Math.floor(Math.random() * pool.length)];
  const distractors = shuffle(pool.filter(n => n !== target)).slice(0, 2);
  const options = shuffle([target, ...distractors]);

  card.innerHTML = `
    ${timerHTML()}
    <div class="quiz-progress">Question ${LOGO_QUESTIONS_NORMAL.length + NUM_COLOR_QUESTIONS + index + 1} / ${TOTAL_QUESTIONS}</div>
    <div class="play-wrap"><div class="play-btn" id="playBtn" role="button" aria-label="Écouter"></div></div>
    <p class="question-text">${testIsExpert ? "Quel accord viens-tu d'entendre ?" : "Quelle note viens-tu d'entendre ?"}</p>

      ${options.map((opt,i) => `<button class="opt-btn" data-opt="${i}">${opt}</button>`).join('')}
    </div>
    <p class="feedback-flash" id="feedback"></p>
  `;
  updateTimerDisplay();

  document.getElementById('playBtn').addEventListener('click', () => {
    if(testIsExpert) playChord(target); else playTone(NOTES[target]);

  const buttons = card.querySelectorAll('.opt-btn');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {

        btn.classList.add('wrong');
        buttons.forEach(b => { if(b.textContent === target) b.classList.add('correct'); });
        document.getElementById('feedback').textContent = 'Pas tout à fait…';
      }
      setTimeout(() => {
        if(testEnded) return;
        if(index + 1 < NUM_NOTE_SINGLE_QUESTIONS){
          renderNoteSingleQuestion(index + 1);
        } else {
          renderNoteSequenceQuestion(0);
        }
      }, 700);
    });
  });
}

/* ===================== Questions mélodie / suite d'accords (11-12) ===================== */
function enableDragReorder(wrap, setOrder){
  let dragState = null;

  function movePlaceholder(after){
    const { placeholder } = dragState;
    const siblings = Array.from(wrap.querySelectorAll('.note-band:not(.dragging)'));
    const firstRects = new Map();
    siblings.forEach(el => firstRects.set(el, el.getBoundingClientRect()));

    if(after){
      wrap.insertBefore(placeholder, after);
    } else {
      wrap.appendChild(placeholder);
    }

    siblings.forEach(el => {
      const first = firstRects.get(el);
      const last = el.getBoundingClientRect();
      const deltaY = first.top - last.top;
      if(deltaY){
        el.style.transition = 'none';
        el.style.transform = `translateY(${deltaY}px)`;
        requestAnimationFrame(() => {
          el.style.transition = 'transform 0.2s ease';
          el.style.transform = '';
        });
      }
    });
  }

  wrap.querySelectorAll('.note-band').forEach(band => {
    const handle = band.querySelector('.drag-handle');

    handle.addEventListener('pointerdown', (e) => {
      const rect = band.getBoundingClientRect();
      const placeholder = document.createElement('div');
      placeholder.className = 'note-band-placeholder';
      placeholder.style.height = rect.height + 'px';
      wrap.insertBefore(placeholder, band);

      band.classList.add('dragging');
      band.style.position = 'fixed';
      band.style.left = rect.left + 'px';
      band.style.top = rect.top + 'px';
      band.style.width = rect.width + 'px';
      document.body.appendChild(band);

      dragState = { band, placeholder, offsetY: e.clientY - rect.top, lastAfter: undefined };
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    handle.addEventListener('pointermove', (e) => {
      if(!dragState || dragState.band !== band) return;
      const rectHeight = band.getBoundingClientRect().height;
      const top = e.clientY - dragState.offsetY;
      band.style.top = top + 'px';

      const centerY = top + rectHeight / 2;
      const others = Array.from(wrap.querySelectorAll('.note-band:not(.dragging)'));
      const after = others.find(sib => {
        const r = sib.getBoundingClientRect();
        return centerY < r.top + r.height / 2;
      }) || null;

      if(after !== dragState.lastAfter){
        dragState.lastAfter = after;
        movePlaceholder(after);
      }
    });

    const endDrag = () => {
      if(!dragState || dragState.band !== band) return;
      const { placeholder } = dragState;
      const beforeRect = band.getBoundingClientRect();

      wrap.insertBefore(band, placeholder);
      wrap.removeChild(placeholder);
      band.style.position = '';
      band.style.left = '';
      band.style.top = '';
      band.style.width = '';

      const afterRect = band.getBoundingClientRect();
      const deltaX = beforeRect.left - afterRect.left;
      const deltaY = beforeRect.top - afterRect.top;
      band.style.transition = 'none';
      band.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
      band.classList.remove('dragging');
      requestAnimationFrame(() => {
        band.style.transition = 'transform 0.2s ease, box-shadow 0.2s ease';
        band.style.transform = '';
      });
      band.addEventListener('transitionend', function handler(){
        band.style.transition = '';
        band.removeEventListener('transitionend', handler);
      });

      dragState = null;
      const newOrder = Array.from(wrap.querySelectorAll('.note-band')).map(b => b.dataset.note);
      setOrder(newOrder);
    };
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  });
}

function renderNoteSequenceQuestion(index){
  const pool = testIsExpert ? CHORD_NAMES : NOTE_NAMES;
  const targetSequence = shuffle(pool).slice(0, 4);
  let bandOrder = shuffle(targetSequence);
  while(bandOrder.join() === targetSequence.join()){
    bandOrder = shuffle(targetSequence);
  }

  function draw(){
    card.innerHTML = `
      ${timerHTML()}
      <div class="quiz-progress">Question ${LOGO_QUESTIONS_NORMAL.length + NUM_COLOR_QUESTIONS + NUM_NOTE_SINGLE_QUESTIONS + index + 1} / ${TOTAL_QUESTIONS}</div>
      <div class="play-wrap"><div class="play-btn" id="playBtn" role="button" aria-label="Écouter"></div></div>
      <p class="question-text">${testIsExpert ? 'Remets les accords dans le bon ordre' : 'Remets les notes dans le bon ordre'}</p>
      <p class="feedback-flash" style="margin-bottom:6px;color:#6b6b67;">Glisse les étiquettes pour les réordonner</p>
      <div class="note-bands" id="bandsWrap">
        ${bandOrder.map((n) => `
          <div class="note-band" data-note="${n}">
            <span class="note-name">${n}</span>
            <span class="drag-handle" aria-label="Glisser pour réordonner">⠿</span>
          </div>
        `).join('')}
      </div>
      <button id="validateOrderBtn">Valider</button>
      <p class="feedback-flash" id="feedback"></p>
    `;
    updateTimerDisplay();
    document.getElementById('playBtn').addEventListener('click', () => {
      if(testIsExpert) playChordSequence(targetSequence); else playSequence(targetSequence);
    });

    const bandsWrap = document.getElementById('bandsWrap');
    enableDragReorder(bandsWrap, (newOrder) => { bandOrder = newOrder; });

    document.getElementById('validateOrderBtn').addEventListener('click', () => {
      const correct = bandOrder.join() === targetSequence.join();
      if(correct){
        noteCorrectCount++;
        document.getElementById('feedback').textContent = 'Bon ordre !';
      } else {
        document.getElementById('feedback').textContent = `Pas tout à fait… l'ordre était : ${targetSequence.join(' - ')}`;
      }
      document.getElementById('validateOrderBtn').disabled = true;
      bandsWrap.classList.add('drop-locked');
      bandsWrap.querySelectorAll('.note-band').forEach(b => b.classList.add('drop-locked'));
      setTimeout(() => {
        if(testEnded) return;
        if(index + 1 < NUM_NOTE_SEQUENCE_QUESTIONS){
          renderNoteSequenceQuestion(index + 1);
        } else {
          renderLoadingScreen();
          finishTest();
        }
      }, 1400);
    });
  }
  draw();
}

/* ===================== Fin du test / bilan ===================== */
async function finishTest(){
  clearInterval(expertTimerInterval);
  testEnded = true;
  const avgColor = colorScores.length ? colorScores.reduce((a,b)=>a+b,0) / colorScores.length : 0;
  const code = generateCode();

  let photoUrl = null;
  let photoErrorDetail = '';
  if(selectedPhotoFile && !testIsLocalOnly){
    const ext = (selectedPhotoFile.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${code}.${ext}`;
    for(let attempt = 1; attempt <= 2; attempt++){
      try{
        const { error: uploadError } = await sb.storage.from('photos').upload(path, selectedPhotoFile, { upsert: true });
        if(!uploadError){
          const { data: publicData } = sb.storage.from('photos').getPublicUrl(path);
          photoUrl = publicData ? publicData.publicUrl : null;
          photoErrorDetail = '';
          break;
        } else {
          photoErrorDetail = uploadError.message || JSON.stringify(uploadError);
          console.error(uploadError);
        }
      } catch(e){
        photoErrorDetail = e.message || String(e);
        console.error(e);
      }
      if(attempt === 1) await new Promise(r => setTimeout(r, 900));
    }
  }

  const bilan = {
    code,
    nom: participant.nom,
    prenom: participant.prenom,
    date: participant.date,
    genre: participant.genre,
    logoScore: logoCorrectCount,
    colorScore: avgColor,
    noteScore: noteCorrectCount,
    photoUrl,
    mode: testIsExpert ? 'expert' : 'normal',
    localOnly: testIsLocalOnly,
    createdAt: new Date().toISOString()
  };

  const allExtra = logoBadge(logoCorrectCount).cls === 'extra'
    && colorBadge(avgColor).cls === 'extra'
    && logoBadge(noteCorrectCount).cls === 'extra';
  if(allExtra) unlockExpertMode();

  let saveError = false;
  let saveErrorDetail = '';

  if(!testIsLocalOnly){
    try{
      const { error } = await sb.from('bilans').insert([{
        code: bilan.code,
        nom: bilan.nom,
        prenom: bilan.prenom,
        date_naissance: bilan.date || null,
        genre: bilan.genre,
        logo_score: bilan.logoScore,
        color_score: bilan.colorScore,
        note_score: bilan.noteScore,
        photo_url: bilan.photoUrl,
        mode: bilan.mode
      }]);
      if(error){
        saveError = true;
        saveErrorDetail = error.message || JSON.stringify(error);
        console.error(error);
      }
    } catch(e){
      saveError = true;
      saveErrorDetail = e.message || String(e);
      console.error(e);
    }

    if(photoErrorDetail && !saveError){
      saveError = true;
      saveErrorDetail = 'photo non enregistré: ' + photoErrorDetail;
    }
  }

  addLocalBilan(bilan);
  renderRegistration();
  renderBilanList();
  if(testIsLocalOnly){
    showLocalOnlyModal(bilan);
  } else {
    showCodeModal(bilan, saveError, saveErrorDetail);
  }
}

/* ===================== Cache local des bilans consultés sur cet appareil ===================== */
const STORAGE_KEY = 'reflexion_bilans_cache';

function loadLocalBilans(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch(e){ return []; }
}
function saveLocalBilans(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function addLocalBilan(bilan){
  const list = loadLocalBilans().filter(b => b.code !== bilan.code);
  list.unshift(bilan);
  saveLocalBilans(list);
}
function removeLocalBilan(code){
  const list = loadLocalBilans().filter(b => b.code !== code);
  saveLocalBilans(list);
  renderBilanList();
}

/* ===================== Recherche d'un bilan par code ===================== */
async function handleFindCode(){
  const input = document.getElementById('codeInput');
  const msg = document.getElementById('codeMsg');
  const code = input.value.trim().toUpperCase();
  msg.className = 'code-msg';
  msg.textContent = '';
  if(!code) return;

  if(loadLocalBilans().some(b => b.code === code)){
    msg.textContent = 'Vous avez déjà votre bilan.';
    msg.classList.add('info');
    return;
  }

  msg.textContent = 'Recherche…';
  try{
    const { data, error } = await sb.from('bilans').select('*').eq('code', code).maybeSingle();
    if(error){
      msg.innerHTML = errorLineHTML('Erreur : ' + (error.message || 'inconnue'));
      msg.classList.add('error');
      console.error(error);
      return;
    }
    if(!data){
      msg.innerHTML = errorLineHTML('Code introuvable');
      msg.classList.add('error');
      return;
    }
    const bilan = mapRowToBilan(data);
    addLocalBilan(bilan);
    renderBilanList();
    msg.textContent = 'Bilan retrouvé !';
    msg.classList.add('success');
    input.value = '';
  } catch(e){
    msg.innerHTML = errorLineHTML('Erreur de connexion, réessaie.');
    msg.classList.add('error');
  }
}
document.getElementById('findCodeBtn').addEventListener('click', handleFindCode);
document.getElementById('codeInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') handleFindCode();
});

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function errorLineHTML(text){
  return `<span class="error-line"><span class="error-badge">!</span><span>${escapeHtml(text)}</span></span>`;
}
function formatDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function calcAge(iso){
  if(!iso) return '';
  const birth = new Date(iso);
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const mDiff = now.getMonth() - birth.getMonth();
  if(mDiff < 0 || (mDiff === 0 && now.getDate() < birth.getDate())) age--;
  return age;
}

/* ===================== Récapitulatif A4 ===================== */
function logoBadge(score){
  if(score === 0) return {label:'Nulle', cls:'nulle'};
  if(score === 1) return {label:'Mauvaise', cls:'mauvaise'};
  if(score === 2) return {label:'Médiocre', cls:'mediocre'};
  if(score === 3) return {label:'Bonne', cls:'bonne'};
  return {label:'Extra', cls:'extra'};
}
function colorBadge(pct){
  if(pct < 25) return {label:'Mauvaise', cls:'mauvaise'};
  if(pct < 50) return {label:'Médiocre', cls:'mediocre'};
  if(pct < 75) return {label:'Bonne', cls:'bonne'};
  return {label:'Extra', cls:'extra'};
}

function openSheet(b){
  const lb = logoBadge(b.logoScore);
  const cb = colorBadge(b.colorScore);
  const nb = typeof b.noteScore === 'number' ? logoBadge(b.noteScore) : null;

      <div><span class="label">Date de naissance</span>${b.date ? formatDate(b.date) + ' (' + calcAge(b.date) + ' ans)' : '—'}</div>
      <div><span class="label">Genre</span>${escapeHtml(b.genre)}</div>
      ${b.localOnly ? '' : `<div><span class="label">Code bilan</span>${escapeHtml(b.code)}</div>`}
      ${b.photoUrl ? `<div><span class="label">Photo</span><img src="${b.photoUrl}" alt="Photo" style="display:block;width:48px;height:48px;border-radius:10px;object-fit:cover;border:1.5px solid #ccc;margin-top:2px;"></div>` : ''}
    </div>
    <div class="result-block">
      <h3>Connaissance en logos (moyenne)</h3>
      <span class="badge ${lb.cls}">${lb.label}</span>
    </div>
    <div class="result-block">
      <h3>Perception des couleurs (moyenne)</h3>
      <span class="badge ${cb.cls}">${cb.label}</span>
    </div>
    ${nb ? `
    <div class="result-block">
      <h3>Capacité à reconnaître les notes</h3>
      <span class="badge ${nb.cls}">${nb.label}</span>
    </div>` : ''}
    <button id="downloadPdfBtn">Télécharger en PDF</button>
  `;
  overlay.classList.add('show');
  document.getElementById('closeSheet').addEventListener('click', () => overlay.classList.remove('show'));
  document.getElementById('downloadPdfBtn').addEventListener('click', () => {
    const dlBtn = document.getElementById('downloadPdfBtn');
    const closeX = document.getElementById('closeSheet');
    const modeTag = sheet.querySelector('.mode-tag');
    const restore = () => {
      dlBtn.style.display = 'block';
      closeX.style.display = 'block';
    };
    const showPdfError = (text) => {
      restore();
      const existing = sheet.querySelector('.pdf-error');
      if(existing) existing.remove();
      const msg = document.createElement('p');
      msg.className = 'pdf-error';
      msg.style.cssText = 'text-align:center;font-size:0.8rem;color:#c0342c;margin-top:10px;';
      msg.innerHTML = errorLineHTML(text);
      sheet.appendChild(msg);
    };

    if(typeof html2pdf === 'undefined'){
      showPdfError('Outil PDF indisponible (bloqué par le navigateur ?), réessaie.');
      return;
    }

    dlBtn.style.display = 'none';
    closeX.style.display = 'none';

    const savedScrollX = window.scrollX;
    const savedScrollY = window.scrollY;
    const savedSheetScroll = sheet.scrollTop;
    window.scrollTo(0, 0);
    sheet.scrollTop = 0;
    const restoreScroll = () => {
      window.scrollTo(savedScrollX, savedScrollY);
      sheet.scrollTop = savedSheetScroll;
    };

    try{
      html2pdf().set({
        margin: 10,
        filename: `bilan_${b.prenom}_${b.nom}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, allowTaint: false, scrollX: 0, scrollY: 0, windowWidth: document.documentElement.scrollWidth, windowHeight: document.documentElement.scrollHeight },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(sheet).save().then(() => {
        restore();
        restoreScroll();
      }).catch((err) => {
        console.error(err);
        showPdfError('La génération du PDF a échoué, réessaie.');
        restoreScroll();
      });
    } catch(err){
      console.error(err);
      showPdfError('La génération du PDF a échoué, réessaie.');
      restoreScroll();
    }
  });
}

}
function wireLock(id, msg, container){
  container.insertAdjacentHTML('beforeend', lockOverlayHTML(id, msg));
  document.getElementById(id).addEventListener('click', () => {
    const tip = document.getElementById(id + 'Tip');
    tip.classList.add('show');
    setTimeout(() => tip.classList.remove('show'), 2500);
  });
}
async function checkMaintenance(){
  try{
    const { data, error } = await sb.from('settings').select('maintenance').eq('id', 1).maybeSingle();
    if(error || !data || !data.maintenance) return;
    wireLock('lockCard', 'Test indisponible pour le moment, veuillez patienter.', document.getElementById('cardWrap'));
    const banner = document.createElement('div');
    banner.id = 'maintenanceBanner';
    banner.textContent = 'Test non accessible pour le moment';
    document.body.prepend(banner);
    document.body.style.paddingTop = '64px';
  } catch(e){
    console.error(e);
  }
}

      </div>
      <p class="info-outro">Ce site n'est qu'un simple site ludique.</p>

  `;

/* ===================== Avis ===================== */
document.getElementById('sendAvisBtn').addEventListener('click', async () => {
  const textarea = document.getElementById('avisText');
  const msg = document.getElementById('avisMsg');
  const texte = textarea.value.trim();
  msg.style.color = '#3f7a2b';
  if(!texte){
    msg.style.color = '#c0342c';
    msg.innerHTML = errorLineHTML('Écris un avis avant d\'envoyer.');
    return;
  }
  msg.textContent = 'Envoi…';
  try{
    const { error } = await sb.from('avis').insert([{ texte }]);
    if(error){
      msg.style.color = '#c0342c';
      msg.innerHTML = errorLineHTML('Erreur : ' + error.message);
      return;
    }
    textarea.value = '';
    msg.textContent = 'Merci pour ton avis !';
  } catch(e){
    msg.style.color = '#c0342c';
    msg.innerHTML = errorLineHTML('Erreur de connexion.');
  }
});
