name: Construire le logiciel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - run: npm run build -- --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Éditeur de tests v1.0.${{ github.run_number }}
          files: |
            dist/Editeur-de-tests-Setup.exe
            dist/Editeur-de-tests-Setup.exe.blockmap
            dist/latest.yml
